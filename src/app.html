<title>Gestão Pontes Rodrigues</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Quicksand:wght@400;500;600;700&display=swap">
<style>
/* Layout: tema claro único; barra lateral branca com o logo do timbre, grafite no texto e dourado para ação e destaque */
:root{color-scheme:light;
  --bg:#f4f3f0;--surface:#ffffff;--surface-2:#f9f8f5;--line:#e4e0d7;--ink:#1c1b19;--muted:#655f55;
  --side:#ffffff;--side-2:#f3efe6;--side-ink:#1c1b19;--side-muted:#7a7366;
  --gold:#8a5e12;--gold-fill:#b98522;--gold-hover:#a07219;--gold-soft:#f5ead3;--on-gold:#1a1408;
  --ok:#2b6e40;--ok-soft:#e3f1e7;--warn:#8f5a08;--warn-soft:#fbeed6;--bad:#a92c26;--bad-soft:#f9e2e0;--info:#2b5686;--info-soft:#e3ebf5;
  --shadow:0 1px 2px rgba(28,27,25,.05),0 8px 24px rgba(28,27,25,.06);
  --f-display:'Oswald','Arial Narrow',Arial,sans-serif;
  --f-body:'Quicksand','Segoe UI',system-ui,sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;font-weight:500;line-height:1.45}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold-fill);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.topbar{background:var(--side);color:var(--side-ink);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:30;box-shadow:0 2px 14px rgba(28,27,25,.05)}
.topbar::before{content:"";display:block;height:3px;background:linear-gradient(90deg,#8b5a14,#bd8821 35%,#e3c382 60%,#bd8821 80%,#8b5a14)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--side)}
.tb-in{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:18px;min-height:70px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.brand{display:block;flex:none}
.brand img{display:block;height:46px;width:auto}
.nav{display:flex;align-items:stretch;justify-content:center;gap:2px;flex:1;min-width:0;align-self:stretch}
.nav a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:78px;padding:8px 10px 6px;color:var(--side-ink);text-decoration:none;font-weight:600;font-size:12.5px;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.nav a .ico{width:38px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--gold)}
.nav a svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7}
.nav a:hover{background:var(--side-2)}
.nav a.on{color:var(--ink);border-bottom-color:var(--gold-fill);background:var(--gold-soft)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.check:has(input:checked){border-color:var(--gold-fill);background:var(--gold-soft)}
.check input{margin-top:3px;accent-color:var(--gold-fill);width:16px;height:16px}
.check b{display:block;font-size:14px}.check small{display:block;color:var(--muted);font-size:12px}
.f label.check{font-size:inherit;color:var(--ink);font-weight:400;letter-spacing:0}
.f .lbl{font-size:12.5px;font-weight:700;color:var(--muted)}
.cfg{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.cfg-nav{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;position:sticky;top:96px}
.cfg-nav button{display:flex;gap:12px;align-items:flex-start;text-align:left;border:0;background:none;border-radius:8px;padding:10px 12px;cursor:pointer;color:var(--ink);font:inherit;border-left:3px solid transparent}
.cfg-nav button:hover{background:var(--surface-2)}
.cfg-nav button.on{background:var(--gold-soft);border-left-color:var(--gold-fill)}
.cfg-nav .num{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);font-size:12px;font-weight:700}
.cfg-nav button.on .num{background:var(--gold-fill);color:var(--on-gold)}
.cfg-nav b{display:block;font-size:14px}
.cfg-nav small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.cfg-body{display:flex;flex-direction:column;gap:16px;min-width:0}
.cfg-sec{display:none}
.cfg-sec.on{display:block}
@media (max-width:860px){.cfg{grid-template-columns:1fr}.cfg-nav{position:static}.cfg-nav small{display:none}.rg{grid-template-columns:1fr!important}}
.nav .ni{position:relative;display:flex}
.nav .ni>a{flex:1}
.nav .dd{position:absolute;top:100%;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 40px rgba(28,27,25,.16);min-width:230px;padding:6px;display:none;z-index:70;text-align:left}
.nav .ni:hover>.dd,.nav .ni:focus-within>.dd{display:block}
.nav.nohover .dd{display:none!important}
.nav .dd button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:7px;font:inherit;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;white-space:nowrap}
.nav .dd button:hover,.nav .dd button:focus-visible{background:var(--gold-soft);color:var(--gold)}
.nav .dd .sep{height:1px;background:var(--line);margin:5px 4px}
.nav .ni:last-child .dd{left:auto;right:0;transform:none}
@media (hover:none),(max-width:860px){.nav .dd{display:none!important}}
.nav a.on .ico{background:linear-gradient(135deg,#d6ac52,#a8771c);color:#fff}
.nav a .ct{position:absolute;top:4px;left:calc(50% + 10px);font-size:10.5px;background:var(--bad);color:#fff;border-radius:20px;padding:0 6px;line-height:17px;font-weight:700}
.tb-st{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--side-muted);white-space:nowrap;flex:none}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:8px;color:inherit;width:42px;height:42px;place-items:center;margin-left:auto;cursor:pointer}
.menu-btn svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--side-muted);flex:none}
.dot.ok{background:#3f9e5c}.dot.warn{background:#d08f22}
.main{min-width:0;padding-block:26px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph h1{font-size:30px;line-height:1.1}
.ph p{margin:4px 0 0;color:var(--muted)}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.banner.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.banner.info{background:var(--gold-soft);border-color:transparent}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;min-height:38px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--gold-fill);border-color:var(--gold-fill);color:var(--on-gold)}
.btn.pri:hover{background:var(--gold-hover)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{min-height:30px;padding:4px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer}
.kpi:hover{border-color:var(--gold-fill)}
.kpi span{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--f-display);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi small{color:var(--muted);font-size:12.5px}
.kpi.alert b{color:var(--bad)}

.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.panel>.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 22px;border-bottom:1px solid var(--line)}
.panel>.hd h2{font-size:17px}
.panel>.bd{padding:14px 18px}
.panel>.bd.flush{padding:0}
.empty{padding:26px 18px;color:var(--muted);text-align:center;font-size:13.5px}

.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 22px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.date-chip{width:46px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:3px 0;line-height:1.1;background:var(--surface-2)}
.date-chip b{display:block;font-family:var(--f-display);font-size:17px;font-weight:500}
.date-chip small{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.date-chip.today{border-color:var(--gold-fill);background:var(--gold-soft)}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search],.toolbar select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-height:38px}
.toolbar input[type=search]{min-width:220px;flex:1 1 220px;max-width:360px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:9px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--gold-fill)}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td .sub{display:block;color:var(--muted);font-size:12px}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* calendário */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2);font-weight:700}
.cal .d{min-height:92px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.cal .d:hover{background:var(--surface-2)}
.cal .d.out{opacity:.45}
.cal .d .n{font-size:12px;font-weight:700;color:var(--muted)}
.cal .d.today .n{color:var(--on-gold);background:var(--gold-fill);border-radius:20px;padding:0 7px;align-self:flex-start}
.cal .ev{font-size:11.5px;border-radius:5px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.t-Audiência{background:var(--info-soft);color:var(--info)}
.t-Prazo{background:var(--bad-soft);color:var(--bad)}
.t-Reunião{background:var(--gold-soft);color:var(--gold)}
.t-Tarefa{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.t-done{text-decoration:line-through;opacity:.6}
.t-Atendimento{background:#e4eef8;color:#2f6fb0}
.t-Compromisso{background:#efe8f7;color:#7a4fb3}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.tl .sub,.row .sub{display:block;color:var(--muted);font-size:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);min-height:34px}
.chip:hover{border-color:var(--gold-fill);background:var(--gold-soft)}
.chip.ai{border-color:var(--gold-fill);color:var(--gold)}
.chip[disabled]{opacity:.5;cursor:not-allowed}


/* detalhe */
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px 32px;padding:4px 0}
.dl div span{display:block;margin-bottom:4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.dl div b{font-weight:600;word-break:break-word}
.timeline{display:flex;flex-direction:column;gap:0;position:relative}
.tl{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:12px;padding:9px 0;border-top:1px dashed var(--line)}
.tl:first-child{border-top:0}
.tl .dt{color:var(--muted);font-size:12.5px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,10,9,.5);display:none;align-items:flex-start;justify-content:center;padding:max(32px,env(safe-area-inset-top,0px)) 16px 32px;z-index:50;overflow:auto}
.modal.open{display:flex}
.dlg{background:var(--surface);border-radius:14px;width:min(920px,100%);box-shadow:0 30px 80px rgba(0,0,0,.35);display:flex;flex-direction:column;max-width:100%}
.dlg.wide{width:min(1180px,100%)}
.dlg>.hd{display:flex;justify-content:space-between;align-items:center;padding:24px 36px 20px;border-bottom:1px solid var(--line);gap:10px}
.dlg>.hd h2{font-size:24px}
.dlg>.bd,.dlg>form>.bd{padding:28px 36px 32px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 28px}
.dlg>.bd.block,.dlg>form>.bd.block{display:flex!important;flex-direction:column;gap:32px!important}
.dlg>.bd.block h3,.dlg>form>.bd.block h3{font-size:17px!important;margin-bottom:12px!important}
.dlg>.bd.block .panel,.dlg>form>.bd.block .panel{box-shadow:none}
.dlg>.ft,.dlg>form>.ft{display:flex;justify-content:space-between;gap:10px;padding:18px 36px;background:var(--surface-2);border-radius:0 0 14px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.dlg>.ft .r,.dlg>form>.ft .r{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.x{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--muted);width:40px;height:40px;border-radius:8px}
.x:hover{background:var(--surface-2)}
.f{display:flex;flex-direction:column;gap:7px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--gold-fill);outline:none;box-shadow:0 0 0 3px var(--gold-soft)}
.f textarea{resize:vertical}
.f .hint{font-size:12px;color:var(--muted)}
.f .hint.ok{color:var(--ok)}.f .hint.bad{color:var(--bad)}
.items{width:100%;border-collapse:collapse}
.items td,.items th{padding:6px 6px;border-bottom:1px solid var(--line);background:none}
.items input{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:6px 8px;width:100%;min-height:34px}
.items tbody tr{cursor:default}
.items tbody tr:hover td{background:none}
.totline{display:flex;justify-content:flex-end;gap:18px;padding-top:10px;font-weight:600}
.totline b{font-family:var(--f-display);font-size:20px;font-weight:500}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--bad);font-weight:600}

/* fatura (documento) */
.fat-doc{background:#fff;color:#1a1a1a;border:1px solid var(--line);border-radius:6px;overflow:hidden;font-family:'Quicksand',sans-serif}
.fat-scroll{overflow-x:auto}
.msg{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:13.5px}
.stage{display:flex;gap:6px;flex-wrap:wrap}
.stage span{font-size:11.5px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);font-weight:600}
.stage span.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.stage span.now{background:var(--gold-soft);color:var(--gold);border-color:var(--gold-fill)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 110px;gap:10px;align-items:center;font-size:13px}
.bar .tr{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar .tr i{display:block;height:100%;background:var(--gold-fill);border-radius:6px}
.bar .tr i.bad{background:var(--bad)}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:30px;font-weight:600;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.skel{color:var(--muted);padding:40px;text-align:center}

.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
/* publicações */
.pubs{display:flex;flex-direction:column;gap:12px}
.pub{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.pub.nova{border-left:4px solid var(--gold-fill)}
.pub-hd{display:flex;gap:14px;align-items:flex-start}
.pub-t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pub-t b{font-family:var(--f-display);font-weight:500;font-size:16px}
.sub-i{color:var(--muted);font-size:13px}
.pub-m{color:var(--muted);font-size:13px;margin-top:4px}
.pub-tx{font-size:13.5px;line-height:1.6;white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:12px 14px;max-height:none}
.pub-ac{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* kanban */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 16px;font-weight:700;cursor:pointer;color:var(--muted);min-height:38px}
.seg button.on{background:var(--gold-fill);color:var(--on-gold)}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(260px,1fr));gap:16px;overflow-x:auto;padding-bottom:8px;align-items:start}
.kcol{background:#ebe7de;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:320px;transition:background .15s,box-shadow .15s}
.kcol.over{background:var(--gold-soft);box-shadow:inset 0 0 0 2px var(--gold-fill)}
.khd{display:flex;align-items:center;gap:8px;padding:2px 4px 4px}
.khd i{width:10px;height:10px;border-radius:3px;flex:none}
.khd h2{font-size:15px}
.khd small{margin-left:auto;color:var(--muted);font-size:12px;font-weight:700}
.kbody{display:flex;flex-direction:column;gap:10px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:12px 14px;display:flex;flex-direction:column;gap:7px;cursor:grab;box-shadow:0 1px 2px rgba(28,27,25,.06)}
.kcard:hover{border-color:var(--gold-fill);box-shadow:0 6px 16px rgba(28,27,25,.08)}
.kcard.late{border-left:3px solid var(--bad)}
.kcard.drag{opacity:.45}
.kcard h3{font-family:var(--f-body);font-size:14.5px;font-weight:700;line-height:1.3;letter-spacing:0}
.kc-top{display:flex;gap:5px;flex-wrap:wrap}
.kc-top .pill{font-size:11px;padding:1px 8px}
.kc-cli{color:var(--muted);font-size:13px}
.kc-ft{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding-top:6px;border-top:1px solid var(--line)}
.kc-ft b{margin-left:auto;color:var(--ink);font-size:13px}
.av{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#e3c382;display:grid;place-items:center;font-size:10.5px;font-weight:700;flex:none}
.kc-mv{display:flex;justify-content:space-between;gap:6px}
.kc-mv button{border:0;background:none;font-size:11.5px;color:var(--muted);cursor:pointer;padding:2px 0;font-weight:600}
.kc-mv button:hover{color:var(--gold)}
.kadd{border:1px dashed #c9c1b1;background:transparent;border-radius:8px;padding:9px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-weight:600;cursor:pointer}
.kadd svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.kadd:hover{border-color:var(--gold-fill);color:var(--gold);background:var(--surface)}
.kempty{border:1px dashed #cfc7b8;border-radius:8px;padding:18px;text-align:center;color:var(--muted);font-size:12.5px}
.kmore{border:0;background:none;color:var(--gold);font-weight:600;cursor:pointer;padding:4px}

/* painel BI */
.slicers{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.slicers label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.slicers select{text-transform:none;letter-spacing:0;font-size:14px;font-weight:600;color:var(--ink);border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:6px 8px;min-height:36px;min-width:150px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-left:auto}
.chip{border:1px solid var(--gold-fill);background:var(--gold-soft);color:var(--gold);border-radius:20px;padding:4px 10px;font-size:12.5px;cursor:pointer}
.hint-bi{font-size:12px;color:var(--muted)}
.bi-kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.bk{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--gold-fill);border-radius:6px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0}
.bk:hover{box-shadow:var(--shadow)}
.bk span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.bk b{font-family:var(--f-display);font-size:28px;font-weight:500;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk small{color:var(--muted);font-size:12px}
.bk.badk{border-top-color:var(--bad)}.bk.badk b{color:var(--bad)}
.bk.warnk{border-top-color:#d08f22}
.bi{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;align-items:stretch}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile.s8{grid-column:span 8}.tile.s4{grid-column:span 4}
.th{display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap}
.th h2{font-size:15px;margin-right:auto}
.th small{font-size:11.5px;color:var(--muted);flex-basis:100%;order:3;margin-top:-4px}
.th a{font-size:12.5px}
.lg{display:flex;gap:12px;font-size:12.5px;color:var(--muted)}
.lg i,.note i,.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{font-size:11px;fill:var(--muted);font-family:var(--f-body)}
.chart .lbl{font-size:12px;fill:var(--ink);font-weight:700;font-family:var(--f-body)}
.donut{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:center;justify-items:center;flex:1;align-content:center}
.donut svg{max-width:200px}
.donut .leg{width:100%}
.donut svg{width:100%;height:auto}
.donut .big{font-family:var(--f-display);font-size:30px;fill:var(--ink)}
.donut .ax{font-size:11px;fill:var(--muted)}
.leg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.leg button{display:grid;grid-template-columns:auto minmax(0,1fr) auto 38px;gap:6px;align-items:center;width:100%;background:none;border:0;padding:4px 6px;border-radius:5px;text-align:left;font-size:12.5px;cursor:pointer}
.leg button:hover{background:var(--surface-2)}
.leg i{margin:0}
.leg small{color:var(--muted);text-align:right}
.hb{display:flex;flex-direction:column;gap:3px}
.hb-r{display:grid;grid-template-columns:minmax(0,40%) minmax(0,1fr) auto;gap:8px;align-items:center;background:none;border:0;padding:5px 4px;border-radius:5px;text-align:left;font-size:12.5px;width:100%}
button.hb-r{cursor:pointer}button.hb-r:hover{background:var(--surface-2)}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:14px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.hb-t i{display:block;height:100%;border-radius:0 4px 4px 0}
.note{font-size:11.5px;color:var(--muted);display:flex;gap:4px 12px;align-items:center;flex-wrap:wrap}
.rows.mini .row{padding:8px 4px;grid-template-columns:auto minmax(0,1fr) auto}
.rows.mini .row .t{font-size:13px}
.rows.mini .date-chip{width:40px}.rows.mini .date-chip b{font-size:15px}
.ctip{position:fixed;z-index:90;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:600;padding:6px 9px;border-radius:6px;pointer-events:none;max-width:260px}
@media (max-width:1180px){.bi-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.tile.s8{grid-column:span 12}.tile.s4{grid-column:span 6}}
@media (max-width:900px){.bi-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.tile.s4,.tile.s8{grid-column:span 12}.slicers label{flex:1 1 140px}.slicers select{min-width:0;width:100%}.chips{margin-left:0}.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}.bk b{font-size:23px}}
@media (max-width:1280px){.tb-st{display:none}}
@media (max-width:1060px){.nav a{min-width:0;padding:8px 8px 6px;font-size:11.5px}.brand img{height:40px}.tb-in{gap:10px}}
@media (max-width:860px){
  .tb-in{flex-wrap:wrap;gap:0 10px}
  .brand{padding-block:8px}
  .nav{flex-basis:100%;order:3;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line)}
  .nav::-webkit-scrollbar{display:none}
  .nav a{flex:1 0 auto;min-width:68px}
  .nav .ni{flex:1 0 auto}
}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid3{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
  .tb-in{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:62px;flex-wrap:wrap;gap:0 12px}
  .brand img{height:40px}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dlg>.bd,.dlg>form>.bd{grid-template-columns:minmax(0,1fr);padding:22px 20px 26px}
  .dlg>.hd{padding:18px 20px 16px}.dlg>.ft,.dlg>form>.ft{padding:14px 20px}.dlg>.hd h2{font-size:21px}
  .ph h1{font-size:25px}
  .cal .d{min-height:64px}.cal .ev{font-size:10px}
  .bar{grid-template-columns:84px minmax(0,1fr) 90px}
  .toolbar input[type=search]{min-width:0;max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function parseCNJ(v){
  var d=String(v||'').replace(/\D/g,'');if(d.length!==20)return null;
  var n=d.slice(0,7),dv=d.slice(7,9),ano=d.slice(9,13),j=d.slice(13,14),tr=d.slice(14,16),o=d.slice(16,20);
  var ok=false;try{ok=(98n-(BigInt(n+ano+j+tr+o)*100n)%97n)===BigInt(dv)}catch(e){}
  var tribunal='',uf='';var t=parseInt(tr,10);
  if(j==='8'){uf=UF_TJ[t]||'';tribunal=uf==='DF'?'TJDFT':'TJ'+uf}
  else if(j==='5')tribunal=t===0?'TST':'TRT'+t;
  else if(j==='4')tribunal=t===0?'CJF':'TRF'+t;
  else if(j==='6'){uf=UF_TJ[t]||'';tribunal=t===0?'TSE':'TRE-'+uf}
  else if(j==='1')tribunal='STF';else if(j==='3')tribunal='STJ';else if(j==='7')tribunal='Justiça Militar da União';else if(j==='9')tribunal='Justiça Militar Estadual';
  return {numero:n+'-'+dv+'.'+ano+'.'+j+'.'+tr+'.'+o,tribunal:tribunal,uf:uf,ano:ano,valido:ok};
}

    },function(err){console.warn(c,err);if(first){first=false;got()}});
  });
  var firstCfg=true;
  DB.doc('config/escritorio').onSnapshot(function(s){
    CFG=Object.assign(JSON.parse(JSON.stringify(DEF_CFG)),s.exists?s.data():{});
    if(firstCfg){firstCfg=false;got()}else render();
  },function(){if(firstCfg){firstCfg=false;got()}});

}

function stamp(o){o.atualizadoEm=new Date().toISOString();if(!o.criadoEm)o.criadoEm=o.atualizadoEm;return o}
async function save(col,data,id){

    if(id){await DB.doc(col+'/'+id).set(clean);return id}

  }

/* ===================== regras de negócio ===================== */
function fatTotal(f){var s=(f.itens||[]).reduce(function(a,i){return a+(Number(i.qtd)||0)*(Number(i.valor)||0)},0);return r2(s-(Number(f.desconto)||0))}
function fatStatus(f){if(f.status==='Emitida'&&f.vencimento&&f.vencimento<today())return 'Vencida';return f.status||'Rascunho'}
function fatAtraso(f){return f.vencimento?Math.max(0,diffDays(f.vencimento,today())):0}
function fatAtualizado(f){
  var t=fatTotal(f),d=fatAtraso(f);if(fatStatus(f)!=='Vencida'||d<=0)return t;
  var multa=Number(f.multa!=null?f.multa:CFG.multa)||0,juros=Number(f.juros!=null?f.juros:CFG.juros)||0;
  return r2(t+t*multa/100+t*(juros/100)*(d/30));
}
function stPill(s){var m={'Rascunho':'','Emitida':'info','Vencida':'bad','Paga':'ok','Cancelada':''};return '<span class="pill '+(m[s]||'')+'">'+esc(s)+'</span>'}
function nextNumero(emissao){
  var y=(emissao||today()).slice(0,4),mx=0;
  S.faturas.forEach(function(f){var m=String(f.numero||'').match(/^(\d{4})\/(\d+)$/);if(m&&m[1]===y)mx=Math.max(mx,parseInt(m[2],10))});
  return y+'/'+pad(mx+1,4);
}
function regua(){return (CFG.regua&&CFG.regua.length?CFG.regua:DEF_CFG.regua).slice().sort(function(a,b){return a.dias-b.dias})}
/* etapa da régua em que a fatura está hoje */
function etapaAtual(f){
  if(['Emitida','Vencida'].indexOf(fatStatus(f))<0||!f.vencimento)return null;
  var rel=diffDays(f.vencimento,today()),cur=null,idx=-1;
  regua().forEach(function(e,i){if(rel>=e.dias){cur=e;idx=i}});
  if(!cur)return null;
  var enviada=(f.cobrancas||[]).some(function(c){return c.etapa===cur.nome});
  return {etapa:cur,idx:idx,enviada:enviada,rel:rel};
}
function msgCobranca(f,e){
  var c=byId('clientes',f.cliente)||{};
  var map={cliente:c.nome||'cliente',numero:f.numero||'',valor:money(fatTotal(f)),vencimento:fd(f.vencimento),valorAtualizado:money(fatAtualizado(f)),dias:fatAtraso(f),pix:CFG.pix||'[chave PIX]',escritorio:CFG.escritorio||''};
  return String(e.texto||'').replace(/\{(\w+)\}/g,function(m,k){return map[k]!=null?map[k]:m});
}
function procParado(p){
  if(['Encerrado','Arquivado','Suspenso'].indexOf(p.situacao)>=0)return false;
  var last=(p.andamentos||[]).reduce(function(a,x){return x.data>a?x.data:a},p.distribuicao||String(p.criadoEm||'').slice(0,10)||'');
  return last&&diffDays(last,today())>30;
}
function ultimoAnd(p){var a=(p.andamentos||[]).slice().sort(function(x,y){return x.data<y.data?1:-1});return a[0]||null}

/* ----- Painel (estilo BI) ----- */
var PAL=['#b98522','#2f6fb0','#d0582a','#2f9a6a','#8a5cc2','#c94f7c'];
var PER={mes:'Este mês','3m':'Últimos 3 meses','6m':'Últimos 6 meses','12m':'Últimos 12 meses',ano:'Este ano'};
function painelF(){return V.bi=V.bi||{per:'6m',resp:'',area:'',sit:''}}
function setBI(k,v){if(v==='Outras')return;painelF()[k]=v;render()}
function limparBI(){V.bi={per:painelF().per,resp:'',area:'',sit:''};render()}
function perRange(per){
  var t=today(),m=t.slice(0,7),start;
  if(per==='mes')start=m+'-01';
  else if(per==='ano')start=t.slice(0,4)+'-01-01';
  else start=addMonths(m+'-01',-(parseInt(per,10)-1));
  return {ini:start,fim:t};
}
function mesesTrend(per){
  var r=perRange(per),ini=r.ini.slice(0,7),cur=today().slice(0,7),out=[];
  var first=ini;var n=0;var x=first;while(x<=cur&&n<24){out.push(x);x=addMonths(x+'-01',1).slice(0,7);n++}
  while(out.length<6)out.unshift(addMonths(out[0]+'-01',-1).slice(0,7));
  return out;
}
function mesLbl(ym){return MES[+ym.slice(5,7)-1]+'/'+ym.slice(2,4)}
function inR(d,r){return d&&d.slice(0,10)>=r.ini&&d.slice(0,10)<=r.fim}
function biMatchProc(p,b){return (!b.resp||p.responsavel===b.resp)&&(!b.area||p.area===b.area)&&(!b.sit||p.situacao===b.sit)}
function biMatchAt(a,b){return (!b.resp||a.responsavel===b.resp)&&(!b.area||a.area===b.area)&&!b.sit}
function biMatchFat(f,b){
  if(!b.resp&&!b.area&&!b.sit)return true;
  var p=byId('processos',f.processo),a=byId('atendimentos',f.atendimento);
  if(p)return biMatchProc(p,b);if(a)return biMatchAt(a,b);return false;
}
function biMatchAg(g,b){
  if(b.resp&&g.responsavel!==b.resp)return false;
  if(b.area||b.sit){var p=byId('processos',g.processo);return p?biMatchProc(p,b):false}
  return true;
}
function kfmt(n){n=Number(n)||0;if(Math.abs(n)>=1e6)return 'R$ '+(n/1e6).toFixed(1).replace('.',',')+' mi';if(Math.abs(n)>=1e4)return 'R$ '+Math.round(n/1e3)+' mil';return money(n)}
function niceMax(v){if(v<=0)return 1;var p=Math.pow(10,Math.floor(Math.log10(v))),m=v/p;return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p}

/* gráficos SVG */
function colChart(meses,series){
  var W=880,H=290,L=70,R=10,T=12,B=28,iw=W-L-R,ih=H-T-B;

  var g='',bw=iw/meses.length,inner=Math.min(30,(bw-14)/series.length);
  for(var i=0;i<=4;i++){var y=T+ih-ih*i/4;g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" class="ax">'+esc(kfmt(mx*i/4))+'</text>'}
  meses.forEach(function(m,i){
    var cx=L+bw*i+bw/2,x0=cx-inner*series.length/2-(series.length-1);
    series.forEach(function(s,j){var v=s.vals[i]||0,h=ih*v/mx,x=x0+j*(inner+2),y=T+ih-h;
      if(h>0)g+='<path d="'+barPath(x,y,inner,h)+'" fill="'+s.color+'"/>';
      g+='<rect x="'+(x-1)+'" y="'+T+'" width="'+(inner+2)+'" height="'+ih+'" fill="transparent" data-tip="'+esc(mesLbl(m)+' · '+s.name+': '+money(v))+'"/>';});
    g+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" class="ax">'+mesLbl(m)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="'+esc(series.map(function(s){return s.name}).join(' e '))+' por mês">'+g+'</svg>';
}
function barPath(x,y,w,h){var r=Math.min(4,h,w/2);return 'M'+x+','+(y+h)+'V'+(y+r)+'Q'+x+','+y+' '+(x+r)+','+y+'H'+(x+w-r)+'Q'+(x+w)+','+y+' '+(x+w)+','+(y+r)+'V'+(y+h)+'Z'}
function lineChart(meses,vals,name){
  var W=420,H=200,L=34,R=14,T=14,B=28,iw=W-L-R,ih=H-T-B;var mx=Math.max(4,Math.ceil(Math.max.apply(null,vals.concat([1]))/4)*4);
  var step=iw/Math.max(1,meses.length-1),pts=vals.map(function(v,i){return [L+step*i,T+ih-ih*v/mx]});
  var g='';for(var i=0;i<=4;i++){var y=T+ih-ih*i/4;g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" class="ax">'+Math.round(mx*i/4)+'</text>'}
  g+='<path d="M'+pts.map(function(p){return p.join(',')}).join('L')+'L'+pts[pts.length-1][0]+','+(T+ih)+'L'+pts[0][0]+','+(T+ih)+'Z" fill="'+PAL[0]+'" opacity=".14"/>';
  g+='<path d="M'+pts.map(function(p){return p.join(',')}).join('L')+'" fill="none" stroke="'+PAL[0]+'" stroke-width="2" stroke-linejoin="round"/>';

    if(i%Math.ceil(meses.length/6)===0||last)g+='<text x="'+p[0]+'" y="'+(H-8)+'" text-anchor="middle" class="ax">'+mesLbl(meses[i])+'</text>'});

function donut(items,key){
  var tot=items.reduce(function(a,x){return a+x.v},0),R=70,r=46,cx=90,cy=90,a0=-Math.PI/2,g='';

  g+='<text x="'+cx+'" y="'+(cy+2)+'" text-anchor="middle" class="big">'+tot+'</text><text x="'+cx+'" y="'+(cy+20)+'" text-anchor="middle" class="ax">processos</text>';

function kanbanAt(st,q){
  var base=S.atendimentos.filter(function(a){
    if(st.f.resp&&a.responsavel!==st.f.resp)return false;if(st.f.cob&&a.cobranca!==st.f.cob)return false;
    return !q||(txt(a)+' '+nomeCli(a.cliente).toLowerCase()).indexOf(q)>=0});

    var items=base.filter(function(a){return (a.status||'Aberto')===col});
    if(col==='Concluído')items.sort(function(a,b){return (b.atualizadoEm||'')<(a.atualizadoEm||'')?-1:1});
    else items.sort(function(a,b){var x=a.retorno||'9999',y=b.retorno||'9999';return x<y?-1:x>y?1:((a.data||'')<(b.data||'')?1:-1)});
    var extra=0;if(col==='Concluído'&&items.length>12){extra=items.length-12;items=items.slice(0,12)}

      (extra?'<button class="kmore" onclick="V.at.view=\'lista\';V.at.f.status=\'Concluído\';render()">+ '+extra+' concluídos na lista</button>':'')+
      (!items.length?'<div class="kempty">Arraste um card para cá</div>':'')+'</div>'+
      (CAN_WRITE&&col!=='Concluído'?'<button class="kadd" onclick="formAtendimento(null,{data:today(),status:\''+col+'\',modalidade:\'Presencial\',area:\'Cível\',cobranca:\'A faturar\',responsavel:equipe()[0]||\'\'})">'+ic('plus')+'Novo atendimento</button>':'')+

  h+='<div class="toolbar"><input type="search" id="q-cli" placeholder="Buscar por nome, CPF/CNPJ, e-mail…" value="'+esc(st.q)+'" oninput="setQ(\'cli\',this.value)"></div>';
  if(!rows.length)return h+'<div class="panel"><div class="empty">'+(S.clientes.length?'Nenhum cliente encontrado.':'Nenhum cliente cadastrado.')+'</div></div>';
  h+='<div class="panel"><div class="tbl-wrap"><table><thead><tr><th>Cliente</th><th>Contato</th><th class="r">Processos</th><th class="r">Atendimentos</th><th class="r">Em aberto</th></tr></thead><tbody>'+rows.map(function(c){

  return h;

  h+='<div class="dl">'+[['Telefone',c.telefone],['E-mail',c.email],['Endereço',c.endereco],['Contato',c.contato]].concat(tipoCt(c)==='Parte contrária'?[]:[['Origem',c.origem]]).map(function(x){return '<div><span>'+x[0]+'</span><b>'+esc(x[1]||'—')+'</b></div>'}).join('')+'</div>';
  if(c.obs)h+='<div class="msg">'+esc(c.obs)+'</div>';

  h+='<div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h3 style="font-size:16px">Atendimentos ('+at.length+')</h3><button class="btn sm" onclick="formAtendimento(null,{cliente:\''+id+'\',data:today(),status:\'Aberto\',cobranca:\'A faturar\',modalidade:\'Presencial\'})">'+ic('plus')+'Atendimento</button></div>'+(at.length?'<div class="panel rows">'+at.map(function(a){return '<div class="row" onclick="verAtendimento(\''+a.id+'\')">'+dateChip(a.data)+'<div style="min-width:0"><div class="t">'+esc(a.assunto)+'</div><div class="s">'+esc(a.status)+' · '+esc(a.modalidade||'')+'</div></div><span></span></div>'}).join('')+'</div>':'<div class="empty">Nenhum atendimento.</div>')+'</div>';
  h+='<div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h3 style="font-size:16px">Faturas ('+fs.length+')</h3><button class="btn sm" onclick="formFatura(null,{cliente:\''+id+'\'})">'+ic('plus')+'Fatura</button></div>'+(fs.length?fatTable(fs):'<div class="empty">Nenhuma fatura.</div>')+'</div>';
  var cts=S.contratos.filter(function(x){return x.cliente===id});
  h+='<div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h3 style="font-size:16px">Contratos ('+cts.length+')</h3><button class="btn sm" onclick="formContrato(null,{cliente:\''+id+'\',tipo:\'Fixo (parcelado)\',status:\'Vigente\',parcelas:1,assinatura:today()})">'+ic('plus')+'Contrato</button></div>'+(cts.length?'<div class="panel rows">'+cts.map(function(c){return '<div class="row" onclick="verContrato(\''+c.id+'\')"><span class="pill '+(c.status==='Vigente'?'ok':'')+'">'+esc(c.status)+'</span><div style="min-width:0"><div class="t">'+esc(c.objeto||'Contrato')+'</div><div class="s">'+esc(c.tipo)+' · '+esc(ctrResumo(c))+'</div></div><span></span></div>'}).join('')+'</div>':'<div class="empty">Nenhum contrato.</div>')+'</div>';
  h+=docsDe('cliente',id);
  h+='</div><div class="ft"><span id="delzone">'+(CAN_WRITE?'<button class="btn ghost danger" onclick="askDelPessoa(\''+id+'\')">'+ic('del')+'Excluir</button>':'')+'</span><div class="r"><button class="btn" onclick="closeModal()">Fechar</button>'+(CAN_WRITE?'<button class="btn pri" onclick="formCliente(\''+id+'\')">Editar cadastro</button>':'')+'</div></div>';

/* ----- Publicações (captura por OAB) ----- */
var PUB_ST=['Nova','Lida','Prazo agendado','Arquivada'];
var F_PUB=[['disponibilizacao','Disponibilizada em','date'],['tribunal','Tribunal / diário','text'],['numero','Número do processo','text',null,1],['oab','OAB intimada','text'],['tipo','Tipo','select',['Intimação','Citação','Edital','Despacho','Decisão','Sentença','Acórdão','Pauta','Outro']],
 ['orgao','Órgão / vara','text',null,1],['texto','Texto da publicação','textarea',8,1],['link','Link (DJEN, diário)','text',null,1],['status','Status','select',PUB_ST]];
function oabs(){return String(CFG.oabs||'').split('\n').map(function(l){var m=l.match(/(\d{3,7})\s*\/?\s*([A-Za-z]{2})\s*[-–]?\s*(.*)/);return m?{num:m[1],uf:m[2].toUpperCase(),nome:m[3].trim()}:null}).filter(Boolean)}
function digits(n){return String(n||'').replace(/\D/g,'')}
function procPorNumero(n){var d=digits(n);if(d.length!==20)return null;for(var i=0;i<S.processos.length;i++)if(digits(S.processos[i].numero)===d)return S.processos[i];return null}
function isUtil(iso){var w=new Date(iso+'T12:00:00').getDay();return w!==0&&w!==6}
function proxUtil(iso){var d=addDays(iso,1);while(!isUtil(d))d=addDays(d,1);return d}
function somaUteis(iso,n){var d=iso;for(var i=0;i<n;i++)d=proxUtil(d);return d}
function dataPub(p){return p.publicacao||(p.disponibilizacao?proxUtil(p.disponibilizacao):'')}
function formPub(id,preset){openForm('publicacoes','publicação',F_PUB,id,preset||{disponibilizacao:today(),status:'Nova',tipo:'Intimação',oab:(oabs()[0]?oabs()[0].num+'/'+oabs()[0].uf:'')})}
function vPublicacoesBase(){
  var st=filterState('pub');st.tab=st.tab||'Nova';var q=st.q.toLowerCase();
  var all=S.publicacoes;
  var novas=all.filter(function(p){return (p.status||'Nova')==='Nova'});
  var semProc=all.filter(function(p){return p.status!=='Arquivada'&&!procPorNumero(p.numero)});
  var h=ph('Publicações','Intimações capturadas no Diário de Justiça Eletrônico Nacional (DJEN) pelas OABs do escritório','<button class="btn" onclick="formPub()">'+ic('plus')+'Registrar manualmente</button>');
  var ob=oabs();
  h+='<div class="banner info"><span>OABs monitoradas: <b>'+(ob.length?ob.map(function(o){return esc(o.num+'/'+o.uf)+(o.nome?' ('+esc(o.nome.split(' ')[0])+')':'')}).join(', '):'nenhuma')+'</b>'+(CFG.pubCapturaEm?' · última captura em '+fd(CFG.pubCapturaEm.slice(0,10))+' às '+CFG.pubCapturaEm.slice(11,16):' · ainda sem captura automática')+'</span><a class="btn sm" href="#config">Editar OABs</a></div>';
  h+='<div class="kpis k4"><div class="kpi'+(novas.length?' alert':'')+'"><span>Novas, não lidas</span><b>'+novas.length+'</b></div><div class="kpi"><span>Disponibilizadas hoje</span><b>'+all.filter(function(p){return p.disponibilizacao===today()}).length+'</b></div><div class="kpi"><span>Com prazo agendado</span><b>'+all.filter(function(p){return p.status==='Prazo agendado'}).length+'</b></div><div class="kpi"><span>Processo não cadastrado</span><b>'+semProc.length+'</b><small>cadastre pelo botão no card</small></div></div>';
  h+='<div class="tabs">'+PUB_ST.concat(['Todas']).map(function(s){var n=s==='Todas'?all.length:all.filter(function(p){return (p.status||'Nova')===s}).length;return '<button class="'+(st.tab===s?'on':'')+'" onclick="V.pub.tab=\''+s+'\';render()">'+s+' <span class="pill" style="margin-left:4px">'+n+'</span></button>'}).join('')+'</div>';
  h+='<div class="toolbar"><input type="search" id="q-pub" placeholder="Buscar no texto, número, tribunal…" value="'+esc(st.q)+'" oninput="setQ(\'pub\',this.value)">'+sel('OAB','pub','oab',ob.map(function(o){return o.num+'/'+o.uf}))+'</div>';
  var rows=all.filter(function(p){return (st.tab==='Todas'||(p.status||'Nova')===st.tab)&&(!st.f.oab||p.oab===st.f.oab)&&(!q||txt(p).indexOf(q)>=0)}).sort(function(a,b){return (a.disponibilizacao||'')<(b.disponibilizacao||'')?1:-1});
  if(!rows.length)return h+'<div class="panel"><div class="empty">'+(all.length?'Nenhuma publicação nesta aba.':'Nenhuma publicação capturada ainda.')+'</div></div>';
  return h+'<div class="pubs">'+rows.map(pubCard).join('')+'</div>';
}
function pubCardBase(p){
  var pr=procPorNumero(p.numero),s=p.status||'Nova',open=V.pubOpen===p.id,t=String(p.texto||'');
  var h='<article class="pub'+(s==='Nova'?' nova':'')+'"><div class="pub-hd"><div class="pub-dt">'+dateChip(p.disponibilizacao||today())+'</div><div style="min-width:0;flex:1"><div class="pub-t"><span class="pill '+({'Nova':'bad','Lida':'','Prazo agendado':'ok','Arquivada':''}[s])+'">'+esc(s)+'</span><span class="pill info">'+esc(p.tipo||'Intimação')+'</span>'+exTag(p)+'<b>'+esc(p.tribunal||'')+'</b>'+(p.orgao?'<span class="sub-i">'+esc(p.orgao)+'</span>':'')+'</div>'+
    '<div class="pub-m"><span class="mono">'+esc(p.numero||'sem número')+'</span>'+(pr?' · <a href="#processos" onclick="event.preventDefault();verProcesso(\''+pr.id+'\')">'+esc(nomeCli(pr.cliente))+'</a>':' · <span style="color:var(--warn)">processo não cadastrado</span>')+' · OAB '+esc(p.oab||'—')+' · publicada em '+fd(dataPub(p))+'</div></div></div>';
  h+='<div class="pub-tx'+(open?' open':'')+'">'+esc(open?t:t.slice(0,420)+(t.length>420?'…':''))+'</div>';
  h+='<div class="pub-ac">'+(t.length>420?'<button class="btn ghost sm" onclick="V.pubOpen='+(open?'null':'\''+p.id+'\'')+';render()">'+(open?'Mostrar menos':'Ler inteiro')+'</button>':'')+(p.link?'<a class="btn ghost sm" href="'+esc(p.link)+'" target="_blank" rel="noopener">Ver no diário ↗</a>':'')+
    (CAN_WRITE?'<span style="flex:1"></span>'+(s==='Nova'?'<button class="btn sm" onclick="pubSt(\''+p.id+'\',\'Lida\')">Marcar como lida</button>':'')+(!pr?'<button class="btn sm" onclick="pubCadProc(\''+p.id+'\')">Cadastrar processo</button>':'')+
    '<button class="btn sm pri" onclick="pubPrazo(\''+p.id+'\')">Agendar prazo</button>'+(s!=='Arquivada'?'<button class="btn ghost sm" onclick="pubSt(\''+p.id+'\',\'Arquivada\')">Arquivar</button>':'')+'<button class="btn ghost sm" onclick="formPub(\''+p.id+'\')">Editar</button>':'')+'</div></article>';
  return h;
}
async function pubSt(id,s){try{await patch('publicacoes',id,{status:s});toast(s==='Lida'?'Marcada como lida':'Publicação arquivada')}catch(e){}}
function pubCadProc(id){var p=byId('publicacoes',id);var c=parseCNJ(p.numero);formProcesso(null,{numero:c?c.numero:p.numero,tribunal:c?c.tribunal:(p.tribunal||''),uf:c?c.uf:'',orgao:p.orgao||'',situacao:'Em andamento',fase:'Conhecimento',area:'Cível',responsavel:equipe()[0]||''})}
function pubPrazo(id){
  var p=byId('publicacoes',id),pr=procPorNumero(p.numero),dp=dataPub(p);
  var h='<div class="hd"><h2>Agendar prazo</h2><button class="x" onclick="closeModal()" aria-label="Fechar">×</button></div><form onsubmit="return pubPrazoSalvar(event,\''+id+'\')"><div class="bd">'+
   '<div class="f full"><label>Publicação</label><div class="msg" style="max-height:140px;overflow:auto">'+esc(String(p.texto||'').slice(0,600))+'</div></div>'+
   '<div class="f"><label for="pz-dias">Prazo em dias úteis</label><input id="pz-dias" type="number" min="1" value="15" oninput="pzCalc(\''+id+'\')"></div>'+
   '<div class="f"><label for="pz-fim">Vencimento</label><input id="pz-fim" type="date"><div class="hint">Publicada em '+fd(dp)+'. A contagem começa no dia útil seguinte e pula sábados e domingos. Confira feriados e suspensões do tribunal.</div></div>'+
   '<div class="f full"><label for="pz-tit">Título na agenda</label><input id="pz-tit" value="'+esc('Prazo: '+(p.tipo||'Intimação')+(pr?' · '+nomeCli(pr.cliente):''))+'"></div>'+
   '<div class="f"><label for="pz-resp">Responsável</label><select id="pz-resp">'+equipe().map(function(e){return '<option>'+esc(e)+'</option>'}).join('')+'</select></div>'+
   '<div class="f"><label for="pz-av">Avisar com antecedência</label><select id="pz-av"><option>No dia</option><option>1 dia antes</option><option selected>3 dias antes</option><option>5 dias antes</option></select></div>'+
   '</div><div class="ft"><span></span><div class="r"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri">Agendar</button></div></div></form>';
  openModal(h,false);pzCalc(id);
}
function pzCalc(id){var p=byId('publicacoes',id),n=parseInt(document.getElementById('pz-dias').value,10)||0;document.getElementById('pz-fim').value=n>0?somaUteis(dataPub(p),n):''}
async function pubPrazoSalvar(e,id){
  e.preventDefault();var p=byId('publicacoes',id),pr=procPorNumero(p.numero),fim=document.getElementById('pz-fim').value;if(!fim){toast('Informe o vencimento');return false}
  try{await save('agenda',{tipo:'Prazo',titulo:document.getElementById('pz-tit').value,data:fim,processo:pr?pr.id:'',cliente:pr?pr.cliente:'',responsavel:document.getElementById('pz-resp').value,status:'Pendente',lembrete:document.getElementById('pz-av').value,obs:'Gerado da publicação de '+fd(p.disponibilizacao)+' ('+(p.tribunal||'')+')',publicacao:id});
    var and=pr?(pr.andamentos||[]).concat([{data:p.disponibilizacao||today(),descricao:'Publicação: '+(p.tipo||'Intimação')+' (prazo até '+fd(fim)+')',origem:'DJEN'}]):null;
    await patch('publicacoes',id,{status:'Prazo agendado',prazoAte:fim});if(pr)await patch('processos',pr.id,{andamentos:and});
    closeModal();toast('Prazo agendado para '+fd(fim))}catch(err){toast('Não foi possível agendar')}
  return false;
}

 ['tipo','Tipo de honorário','select',CTR_T],['status','Status','select',CTR_ST],['valor','Valor (R$)','number',null,0,'Fixo: valor total · Mensal: valor por mês'],['parcelas','Parcelas / meses','number'],

function formContrato(id,preset){openForm('contratos','contrato',F_CTR,id,preset||{tipo:'Fixo (parcelado)',status:'Vigente',parcelas:1,assinatura:today(),primeiroVenc:addDays(today(),10),responsavel:equipe()[0]||''},function(nid){if(nid)verContrato(id||nid)})}
function formDoc(id,preset){openForm('documentos','documento',F_DOC,id,preset||{tipo:'Petição',data:today()})}
function fileLinks(o){
  var a=[];if(o.arquivo&&o.arquivo.id)a.push('<a href="/_blob/'+esc(o.arquivo.id)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'+esc(o.arquivo.nome||'Abrir arquivo')+' ↗</a>');

  return a.join(' · ')||'<span class="sub">sem arquivo</span>';
}
function ctrFats(id){return S.faturas.filter(function(f){return f.contrato===id&&f.status!=='Cancelada'})}
function ctrResumo(c){var v=Number(c.valor)||0;if(c.tipo==='Mensal (assessoria)')return money(v)+'/mês'+(c.parcelas?' · '+c.parcelas+' meses':'');if(c.tipo==='Êxito')return (c.exito||0)+'% de êxito';if(c.tipo==='Fixo + êxito')return money(v)+' + '+(c.exito||0)+'%';if(c.tipo==='Por hora')return money(v)+'/hora';return money(v)+(Number(c.parcelas)>1?' em '+c.parcelas+'x':'')}
function vContratos(){
  var st=filterState('ctr'),q=st.q.toLowerCase();
  var h=ph('Contratos de honorários','Contratos com clientes e geração das faturas de cada um','<button class="btn pri" onclick="formContrato()">'+ic('plus')+'Novo contrato</button>');
  var vig=S.contratos.filter(function(c){return c.status==='Vigente'});
  var mens=vig.filter(function(c){return c.tipo==='Mensal (assessoria)'}).reduce(function(a,c){return a+(Number(c.valor)||0)},0);
  var semFat=vig.filter(function(c){return !ctrFats(c.id).length&&c.tipo!=='Êxito'}).length;
  h+='<div class="kpis k4"><div class="kpi"><span>Contratos vigentes</span><b>'+vig.length+'</b></div><div class="kpi"><span>Receita recorrente</span><b class="num">'+money(mens)+'</b><small>por mês, contratos mensais</small></div><div class="kpi"><span>Em negociação</span><b>'+S.contratos.filter(function(c){return c.status==='Em negociação'}).length+'</b></div><div class="kpi'+(semFat?' alert':'')+'"><span>Vigentes sem fatura</span><b>'+semFat+'</b><small>gere as faturas pelo contrato</small></div></div>';
  h+='<div class="toolbar"><input type="search" id="q-ctr" placeholder="Buscar por cliente, objeto…" value="'+esc(st.q)+'" oninput="setQ(\'ctr\',this.value)">'+sel('Status','ctr','status',CTR_ST)+sel('Tipo','ctr','tipo',CTR_T)+'</div>';
  var rows=S.contratos.filter(function(c){return (!st.f.status||c.status===st.f.status)&&(!st.f.tipo||c.tipo===st.f.tipo)&&(!q||(txt(c)+' '+nomeCli(c.cliente).toLowerCase()).indexOf(q)>=0)}).sort(function(a,b){return (a.assinatura||'')<(b.assinatura||'')?1:-1});

function faturarContrato(id){
  var c=byId('contratos',id),tot=Math.max(1,parseInt(c.parcelas,10)||1),v=Number(c.valor)||0,desc;
  var ja=ctrFats(id),n=Math.max(1,tot-ja.length),ult=ja.reduce(function(m,f){return f.vencimento>m?f.vencimento:m},'');
  var venc=ult?addMonths(ult,1):(c.primeiroVenc&&c.primeiroVenc>=today()?c.primeiroVenc:addDays(today(),Number(CFG.vencDias)||10));
  if(c.tipo==='Fixo (parcelado)'||c.tipo==='Fixo + êxito')v=r2(v/tot*n);
  var p={cliente:c.cliente,processo:c.processo||'',contrato:id,vencimento:venc,obs:'Referente ao contrato de honorários'+(c.assinatura?' de '+fd(c.assinatura):'')+'.'};
  if(c.tipo==='Mensal (assessoria)'){desc=(c.objeto||'Assessoria jurídica')+' (mensalidade)';p.itens=[{descricao:desc,qtd:1,valor:r2(v*n)}];p.parcelasPreset=n}
  else if(c.tipo==='Êxito'){p.itens=[{descricao:'Honorários de êxito ('+(c.exito||0)+'%): '+(c.objeto||''),qtd:1,valor:0}]}
  else if(c.tipo==='Por hora'){p.itens=[{descricao:'Horas técnicas: '+(c.objeto||''),qtd:1,valor:v}]}
  else{p.itens=[{descricao:'Honorários advocatícios: '+(c.objeto||''),qtd:1,valor:v}];p.parcelasPreset=n}
  formFatura(null,p);
}

async function saveFatura(e,forceStatus){
  if(e&&e.preventDefault)e.preventDefault();
  var r=readFat();if(!r.cliente){toast('Escolha o cliente');return false}
  var d=Object.assign({},FAT.d,r);delete d.parcelasPreset;d.itens=FAT.d.itens.filter(function(i){return (i.descricao||'').trim()||Number(i.valor)}).map(function(i){return {descricao:i.descricao,qtd:Number(i.qtd)||0,valor:Number(i.valor)||0}});
  if(!d.itens.length){toast('Inclua ao menos um item');return false}
  if(fatTotal(d)<=0){toast('O total da fatura precisa ser maior que zero');return false}
  var after=FAT.after;
  try{
    if(FAT.id){var st=document.getElementById('ff-status');if(st)d.status=st.value;if(d.status==='Paga'&&!d.pagamento)d.pagamento={data:today(),valor:fatTotal(d),forma:d.forma};delete d.id;await save('faturas',d,FAT.id);closeModal();toast('Fatura salva');verFatura(FAT.id)}
    else{
      d.status=forceStatus||'Emitida';var n=Number((document.getElementById('ff-parc')||{}).value)||1;var ids=[];
      if(n===1){d.numero=nextNumero(d.emissao);d.cobrancas=[];ids.push(await save('faturas',d))}
      else{var tot=fatTotal(d),each=r2(tot/n),grupo='P'+Date.now().toString(36);
        for(var i=0;i<n;i++){var v=i===n-1?r2(tot-each*(n-1)):each;
          var x=Object.assign({},d,{numero:nextNumero(d.emissao),parcela:(i+1)+'/'+n,grupo:grupo,vencimento:addMonths(r.vencimento,i),desconto:0,cobrancas:[],
            itens:[{descricao:(d.itens[0].descricao||'Honorários advocatícios')+' (parcela '+(i+1)+'/'+n+')',qtd:1,valor:v}]});
          ids.push(await save('faturas',x));if(!DB)S.faturas[S.faturas.length-1].numero=x.numero;}
      }
      closeModal();toast(n>1?n+' faturas emitidas':(d.status==='Rascunho'?'Rascunho salvo':'Fatura emitida'));
      if(after)after(ids[0]);if(ids[0])setTimeout(function(){verFatura(ids[0])},DB?400:0);
    }
  }catch(err){if(String(err&&err.message)!=='ro')toast('Erro ao salvar a fatura')}
  return false;
}

function verFatura(id){
  var f=byId('faturas',id);if(!f)return;FAT={id:id,d:JSON.parse(JSON.stringify(f))};
  var s=fatStatus(f),e=etapaAtual(f);
  var h='<div class="hd"><div><h2>Fatura '+esc(f.numero||'')+' '+stPill(s)+'</h2><div style="color:var(--muted);font-size:13px;margin-top:2px">'+esc(nomeCli(f.cliente))+' · '+money(fatTotal(f))+' · vence '+fd(f.vencimento)+'</div></div><button class="x" onclick="closeModal()" aria-label="Fechar">×</button></div><div class="bd block" style="display:flex;flex-direction:column;gap:16px">';
  if(['Emitida','Vencida'].indexOf(s)>=0){
    h+='<div class="panel"><div class="hd"><h2>Cobrança</h2>'+(s==='Vencida'?'<span class="pill bad">'+fatAtraso(f)+' dias · '+money(fatAtualizado(f))+'</span>':'<span class="pill info">'+rel(f.vencimento)+'</span>')+'</div><div class="bd" style="display:flex;flex-direction:column;gap:12px">';
    h+='<div class="stage">'+regua().map(function(r,i){var done=(f.cobrancas||[]).some(function(c){return c.etapa===r.nome});return '<span class="'+(done?'done':e&&e.idx===i?'now':'')+'">'+(done?'✓ ':'')+esc(r.nome)+' ('+(r.dias===0?'D':r.dias<0?'D'+r.dias:'D+'+r.dias)+')</span>'}).join('')+'</div>';
    var et=e?e.etapa:regua()[0];
    h+='<div class="f"><label for="cob-etapa">Mensagem</label><select id="cob-etapa" onchange="msgTroca(\''+id+'\')">'+regua().map(function(r){return '<option'+(r.nome===et.nome?' selected':'')+'>'+esc(r.nome)+'</option>'}).join('')+'</select></div><div class="msg" id="cob-msg">'+esc(msgCobranca(f,et))+'</div>';
    var c=byId('clientes',f.cliente)||{};
    h+='<div class="toolbar"><button class="btn" onclick="copiarMsg()">Copiar mensagem</button>'+(c.telefone?'<a class="btn" target="_blank" rel="noopener" id="wa-link" href="'+waLink(c.telefone,msgCobranca(f,et))+'">Abrir no WhatsApp ↗</a>':'')+(CAN_WRITE?'<select id="cob-canal" aria-label="Canal"><option>WhatsApp</option><option>E-mail</option><option>Telefone</option><option>Carta / AR</option></select><button class="btn pri" onclick="registrarCob(\''+id+'\')">Registrar envio</button>':'')+'</div>';
    if(c.telefone)h+='<div style="font-size:12.5px;color:var(--muted)">Telefone do cliente: <span style="user-select:all">'+esc(c.telefone)+'</span>'+(c.email?' · e-mail: <span style="user-select:all">'+esc(c.email)+'</span>':'')+'</div>';
    if((f.cobrancas||[]).length)h+='<div class="timeline">'+f.cobrancas.slice().reverse().map(function(cb){return '<div class="tl"><span class="dt num">'+fd(cb.data)+'</span><span>'+esc(cb.etapa)+' enviada por '+esc(cb.canal)+'</span><span></span></div>'}).join('')+'</div>';
    if(CAN_WRITE)h+='<form class="toolbar" onsubmit="return pagar(event,\''+id+'\')" style="border-top:1px solid var(--line);padding-top:12px"><b style="font-size:13.5px">Registrar pagamento</b><input type="date" id="pg-d" value="'+today()+'" aria-label="Data do pagamento" style="border:1px solid var(--line);border-radius:8px;padding:7px;min-height:38px;background:var(--surface-2)"><input type="number" step="0.01" id="pg-v" value="'+fatAtualizado(f).toFixed(2)+'" aria-label="Valor pago" style="border:1px solid var(--line);border-radius:8px;padding:7px;min-height:38px;width:130px;background:var(--surface-2)"><button class="btn pri">Dar baixa</button></form>';
    h+='</div></div>';
  }
  h+='<div class="fat-scroll"><div class="fat-doc" style="width:796px">'+fatDocHTML(f)+'</div></div>';
  h+='</div><div class="ft"><span>'+(CAN_WRITE&&s==='Rascunho'?'<button class="btn pri" onclick="emitir(\''+id+'\')">Emitir agora</button>':'')+'</span><div class="r"><button class="btn" onclick="baixarFatura(\''+id+'\')">Baixar fatura (.html)</button><button class="btn" onclick="copiarFatura(\''+id+'\')">Copiar resumo</button>'+(CAN_WRITE?'<button class="btn" onclick="formFatura(\''+id+'\')">Editar</button>':'')+'</div></div>';
  openModal(h,true);

function waLink(tel,msg){var d=String(tel).replace(/\D/g,'');if(d.length<=11)d='55'+d;return 'https://wa.me/'+d+'?text='+encodeURIComponent(msg)}
function msgTroca(id){var f=byId('faturas',id),n=document.getElementById('cob-etapa').value,e=regua().filter(function(r){return r.nome===n})[0];var m=msgCobranca(f,e);document.getElementById('cob-msg').textContent=m;var w=document.getElementById('wa-link');var c=byId('clientes',f.cliente)||{};if(w&&c.telefone)w.href=waLink(c.telefone,m)}
function copyText(t,ok){try{navigator.clipboard.writeText(t).then(function(){toast(ok)},function(){toast('Selecione o texto e copie manualmente')})}catch(e){toast('Selecione o texto e copie manualmente')}}
function copiarMsg(){copyText(document.getElementById('cob-msg').textContent,'Mensagem copiada')}
function copiarFatura(id){var f=byId('faturas',id);copyText('Fatura '+f.numero+' · '+nomeCli(f.cliente)+'\nValor: '+money(fatTotal(f))+'\nVencimento: '+fd(f.vencimento)+(CFG.pix?'\nChave PIX: '+CFG.pix:'')+'\n'+CFG.escritorio,'Resumo copiado')}
async function registrarCob(id){var f=byId('faturas',id);var et=document.getElementById('cob-etapa').value,canal=document.getElementById('cob-canal').value;
  try{await patch('faturas',id,{cobrancas:(f.cobrancas||[]).concat([{data:today(),etapa:et,canal:canal}])});toast('Cobrança registrada');verFatura(id)}catch(e){}}
async function pagar(e,id){e.preventDefault();var d=document.getElementById('pg-d').value||today(),v=Number(document.getElementById('pg-v').value)||0;var f=byId('faturas',id);
  try{await patch('faturas',id,{status:'Paga',pagamento:{data:d,valor:v,forma:f.forma||''}});toast('Pagamento registrado');verFatura(id)}catch(err){}return false}
async function emitir(id){try{await patch('faturas',id,{status:'Emitida'});toast('Fatura emitida');verFatura(id)}catch(e){}}
async function baixarFatura(id){
  var f=byId('faturas',id);var dl=null;try{dl=await window.claude.use('downloads')}catch(e){}
  if(!dl){toast('Download indisponível aqui. Use “Copiar resumo”.');return}
  var html='<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Fatura '+esc(f.numero)+'</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Quicksand:wght@500;700&display=swap"><style>body{margin:0;background:#eee;display:flex;justify-content:center;padding:20px}@media print{body{background:#fff;padding:0}}@page{size:A4;margin:0}</style></head><body>'+fatDocHTML(f)+'</body></html>';
  try{await dl.save({filename:'Fatura '+String(f.numero).replace('/','-')+' - '+nomeCli(f.cliente)+'.html',data:new Blob([html],{type:'text/html'})});toast('Fatura salva. Abra no navegador e imprima em PDF.')}catch(e){toast('Download cancelado')}
}

/* ----- Cobrança (régua) ----- */
function vCobranca(){
  var abertas=S.faturas.filter(function(f){return ['Emitida','Vencida'].indexOf(fatStatus(f))>=0});
  var lst=abertas.map(function(f){return {f:f,e:etapaAtual(f)}});
  var pend=lst.filter(function(x){return x.e&&!x.e.enviada}).sort(function(a,b){return b.e.rel-a.e.rel});
  var feitas=lst.filter(function(x){return x.e&&x.e.enviada});
  var prox=lst.filter(function(x){return !x.e}).sort(function(a,b){return a.f.vencimento<b.f.vencimento?-1:1});
  var h=ph('Cobrança','Régua automática: o sistema indica quem cobrar hoje e prepara a mensagem','<a class="btn" href="#config">Ajustar régua</a>');
  h+='<div class="panel"><div class="bd"><div class="stage">'+regua().map(function(r){return '<span class="now">'+(r.dias===0?'No vencimento':r.dias<0?(-r.dias)+' dias antes':r.dias+' dias depois')+': '+esc(r.nome)+'</span>'}).join('')+'</div></div></div>';
  function bloco(t,arr,vazio,cls){
    return '<div class="panel"><div class="hd"><h2>'+t+'</h2><span class="pill '+(cls||'')+'">'+arr.length+'</span></div><div class="bd flush rows">'+(arr.length?arr.map(function(x){var f=x.f,s=fatStatus(f);var last=(f.cobrancas||[]).slice(-1)[0];
      return '<div class="row" onclick="verFatura(\''+f.id+'\')">'+(x.e?'<span class="pill '+(x.e.rel>0?'bad':'gold')+'">'+esc(x.e.etapa.nome)+'</span>':dateChip(f.vencimento))+'<div style="min-width:0"><div class="t">'+esc(nomeCli(f.cliente))+exTag(f)+'</div><div class="s">Fatura '+esc(f.numero)+' · venc. '+fd(f.vencimento)+(s==='Vencida'?' · '+fatAtraso(f)+' dias de atraso':'')+(last?' · última cobrança '+fd(last.data)+' ('+esc(last.canal)+')':'')+'</div></div><b class="num" style="'+(s==='Vencida'?'color:var(--bad)':'')+'">'+money(fatAtualizado(f))+'</b></div>'}).join(''):'<div class="empty">'+vazio+'</div>')+'</div></div>';
  }
  h+=bloco('Cobrar hoje',pend,'Nenhuma cobrança pendente. Tudo em dia.','bad');
  h+='<div class="grid2">'+bloco('Já cobradas nesta etapa',feitas,'Nada por aqui.')+bloco('Ainda fora da régua',prox,'Nenhuma fatura aguardando.')+'</div>';
  return h;
}

async function salvarCfg(e){
  e.preventDefault();var g=function(k){return document.getElementById('cf-'+k).value};
  var rg=regua().map(function(r,i){return {nome:document.getElementById('rg-n-'+i).value.trim()||r.nome,dias:Number(document.getElementById('rg-d-'+i).value)||0,texto:document.getElementById('rg-t-'+i).value}});
  try{await saveCfg({escritorio:g('escritorio'),cnpj:g('cnpj'),oab:g('oab'),endereco:g('endereco'),telefone:g('telefone'),email:g('email'),site:g('site'),equipe:document.getElementById('cf-equipe').value,oabs:document.getElementById('cf-oabs').value,pix:g('pix'),banco:g('banco'),agencia:g('agencia'),conta:g('conta'),vencDias:Number(g('vencDias'))||10,multa:Number(g('multa'))||0,juros:Number(g('juros'))||0,regua:rg})}catch(err){toast('Não foi possível salvar')}
  return false;
}

/* ---------- boot com IA e portal do cliente ---------- */
async function boot(){
  route();
  var db=null;
  try{if(window.claude&&window.claude.use)db=await window.claude.use('db')}catch(e){db=null}
  if(!db){MODE='local';var ex=DEMO;COLS.forEach(function(c){S[c]=(ex[c]||[]).map(function(o){return Object.assign({},o)})});setStatus();render();return}
  DB=db;MODE='live';
  try{USERNS=await window.claude.use('user')}catch(e){USERNS=null}
  try{if(USERNS){ME_ID=await USERNS.id();var own=USERNS.isOwner?USERNS.isOwner():false;var w=USERNS.can?await USERNS.can('data.write'):null;if(w===false&&!own)CAN_WRITE=false}}catch(e){}
  if(!CAN_WRITE)return portalMode();
  try{ASSETS=await window.claude.use('assets')}catch(e){ASSETS=null}
  try{SAMPLE=await window.claude.use('sample')}catch(e){SAMPLE=null}
  var pending=COLS.length+1,timer=setTimeout(function(){if(pending>0){MODE='timeout';setStatus();render()}},10000);
  function got(){if(pending>0){pending--;if(pending===0){clearTimeout(timer);MODE='live';setStatus()}}render()}
  COLS.forEach(function(c){
    var first=true;
    DB.collection(c).limit(1000).onSnapshot(function(snap){
      S[c]=snap.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o});
      if(first){first=false;got()}else render();
    },function(err){console.warn(c,err);if(first){first=false;got()}});
  });
  var firstCfg=true;
  DB.doc('config/escritorio').onSnapshot(function(s){
    CFG=Object.assign(JSON.parse(JSON.stringify(DEF_CFG)),s.exists?s.data():{});
    if(firstCfg){firstCfg=false;got()}else render();
  },function(){if(firstCfg){firstCfg=false;got()}});
  setStatus();
}

function impPreview(){
  var t=document.getElementById('imp-txt').value.trim(),out=document.getElementById('imp-out');if(!t){out.innerHTML='<div class="banner warn">Cole os dados primeiro.</div>';return}
  var lines=t.split(/\r?\n/).filter(function(l){return l.trim()});var sp=lines[0].indexOf('\t')>=0?'\t':';';var heads=lines[0].split(sp).map(function(x){return HMAP[x.trim().toLowerCase()]||null});
  IMP=lines.slice(1).map(function(l){var c=l.split(sp),o={};heads.forEach(function(k,i){if(k&&c[i]!=null&&c[i].trim())o[k]=c[i].trim()});
    if(o.numero){var p=parseCNJ(o.numero);if(p){o.numero=p.numero;o.tribunal=o.tribunal||p.tribunal;o.uf=o.uf||p.uf}}

  var ign=lines[0].split(sp).filter(function(x,i){return !heads[i]});
  var dup=IMP.filter(function(o){return o.numero&&procPorNumero(o.numero)}).length;

async function impRun(){
  var b=document.getElementById('imp-go');b.disabled=true;var n=0,c=0,pul=0,out=document.getElementById('imp-out');
  for(var i=0;i<IMP.length;i++){var o=Object.assign({},IMP[i]);if(o.numero&&procPorNumero(o.numero)){pul++;continue}
    try{if(o.cliente){var ex=acharCliente(o.cliente);if(ex)o.cliente=ex.id;else{o.cliente=await garantirCliente(o.cliente);c++}}
      o.situacao=o.situacao||'Em andamento';o.fase=o.fase||'Conhecimento';o.area=o.area||'Cível';o.responsavel=o.responsavel||equipe()[0]||'';o.andamentos=[];await save('processos',o);n++;
      out.innerHTML='<div class="banner info">Importando… '+n+' de '+IMP.length+'</div>'}catch(e){}}
  out.innerHTML='<div class="banner info">Importação concluída: '+n+' processo(s), '+c+' cliente(s) novo(s)'+(pul?', '+pul+' já existente(s) pulado(s)':'')+'.</div>';IMP=[];
}

  openModal('<div class="hd"><h2>'+ic('spark')+' Cadastrar processo por IA</h2><button class="x" onclick="closeModal()" aria-label="Fechar">×</button></div><div class="bd block" style="display:flex;flex-direction:column;gap:12px">'+aiNote()+'<div style="color:var(--muted);font-size:13.5px">Cole o texto de uma intimação, publicação, capa do Projudi/PJe/e-SAJ ou petição inicial. A IA extrai os dados e abre o cadastro preenchido para você conferir e salvar.</div><div class="f full"><label for="iap-txt">Texto</label><textarea id="iap-txt" rows="12" placeholder="Cole aqui o texto…"></textarea></div><div id="iap-msg" style="font-size:13px;color:var(--muted)"></div></div>'+
   '<div class="ft"><span></span><div class="r"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="iap-go" onclick="procIARun()"'+aiOff()+'>'+ic('spark')+'Extrair dados</button></div></div>',true);

async function procIARun(){
  var t=document.getElementById('iap-txt').value.trim();if(!t){toast('Cole o texto');return}var b=document.getElementById('iap-go'),m=document.getElementById('iap-msg');b.disabled=true;m.textContent='Analisando…';
  try{
    var cls=optsCli().map(function(x){return x[1]}).slice(0,200);
    var o=await SAMPLE.json('Você é assistente de cadastro de um escritório de advocacia brasileiro. Extraia do texto abaixo os dados do processo judicial e responda SOMENTE um JSON com as chaves: numero (CNJ NNNNNNN-DD.AAAA.J.TR.OOOO ou ""), cliente (nome da parte que é cliente do escritório; prefira o nome exato da lista de clientes conhecidos), polo (Autor, Réu, Exequente, Executado, Requerente, Requerido, Impetrante ou Terceiro interessado), parteContraria, objeto (classe e objeto resumido), orgao (vara/câmara), comarca, tribunal (sigla), uf, area (uma de: '+AREAS.join(', ')+'), valorCausa (número ou null), distribuicao (AAAA-MM-DD ou ""), situacao (uma de: '+SIT.join(', ')+'), prazoDias (dias úteis de prazo se houver intimação, ou null), resumo (2 frases: o que o documento diz e o próximo passo). Clientes conhecidos: '+JSON.stringify(cls)+'\n\nTEXTO:\n'+t.slice(0,60000),{modelTier:'default'});
    o=o||{};var pre={numero:o.numero||'',polo:o.polo||'Autor',parteContraria:o.parteContraria||'',objeto:o.objeto||'',orgao:o.orgao||'',comarca:o.comarca||'',tribunal:o.tribunal||'',uf:o.uf||'',area:AREAS.indexOf(o.area)>=0?o.area:'Cível',valorCausa:o.valorCausa||null,distribuicao:o.distribuicao||'',situacao:SIT.indexOf(o.situacao)>=0?o.situacao:'Em andamento',fase:'Conhecimento',responsavel:equipe()[0]||'',obs:o.resumo||''};
    var p=parseCNJ(pre.numero);if(p){pre.numero=p.numero;pre.tribunal=pre.tribunal||p.tribunal;pre.uf=pre.uf||p.uf}
    var dup=pre.numero&&procPorNumero(pre.numero);if(dup){m.textContent='Este processo já está cadastrado.';b.disabled=false;verProcesso(dup.id);return}
    if(o.cliente){var ex=acharCliente(o.cliente);pre.cliente=ex?ex.id:await garantirCliente(o.cliente)}
    var prazo=Number(o.prazoDias)||0;
    openForm('processos','processo',F_PROC,null,pre,function(nid){if(!nid)return;if(prazo){formAgenda(null,{tipo:'Prazo',titulo:'Prazo · '+String(pre.objeto||'').slice(0,60),data:somaUteis(today(),prazo),processo:nid,cliente:pre.cliente||'',prioridade:'Alta'});toast('Processo salvo. Confira o prazo sugerido')}else verProcesso(nid)});
    toast('Dados extraídos: confira e salve');
  }catch(e){m.textContent='Não foi possível: '+((e&&(e.message||e.code))||e);b.disabled=false}
}

/* importar autos (PDF) */
var PDFJS=null;
function loadPdfJs(){return new Promise(function(res,rej){if(PDFJS)return res(PDFJS);var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=function(){PDFJS=window['pdfjs-dist/build/pdf'];PDFJS.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(PDFJS)};s.onerror=function(){rej(new Error('não foi possível carregar o leitor de PDF'))};document.head.appendChild(s)})}
async function pdfText(file,onP){var lib=await loadPdfJs();var doc=await lib.getDocument({data:await file.arrayBuffer()}).promise;var out=[];for(var i=1;i<=doc.numPages;i++){var pg=await doc.getPage(i);var tc=await pg.getTextContent();var line='',last=null;tc.items.forEach(function(it){if(last&&Math.abs(it.transform[5]-last.transform[5])>2)line+='\n';line+=it.str+(it.hasEOL?'\n':' ');last=it});out.push('--- página '+i+' ---\n'+line);if(onP)onP(i,doc.numPages)}return {text:out.join('\n'),pages:doc.numPages}}
function procAutos(){
  openModal('<div class="hd"><h2>'+ic('pdf')+' Importar autos do processo</h2><button class="x" onclick="closeModal()" aria-label="Fechar">×</button></div><div class="bd block" style="display:flex;flex-direction:column;gap:12px">'+aiNote()+'<div style="color:var(--muted);font-size:13.5px">Envie o PDF da íntegra dos autos (Projudi, PJe, e-SAJ) ou cole o texto. A IA extrai os dados do processo, as partes, os andamentos relevantes com datas e os prazos em aberto, e cadastra tudo de uma vez: processo, cliente, andamentos e agenda. Autos muito longos são lidos no início e no fim (capa, inicial e últimas decisões).</div>'+
   '<div class="f"><label for="au-file">Arquivo PDF ou .txt</label><input type="file" id="au-file" accept="application/pdf,.pdf,.txt,text/plain" onchange="autosLer(this)"><div class="hint" id="au-info"></div></div><div class="f"><label for="au-cli">Cliente (opcional)</label><select id="au-cli"><option value="">Identificar pelos autos</option>'+optsCli().map(function(x){return '<option value="'+esc(x[0])+'">'+esc(x[1])+'</option>'}).join('')+'</select></div>'+
   '<div class="f full"><label for="au-txt">Texto dos autos</label><textarea id="au-txt" rows="8" placeholder="O texto do PDF aparece aqui. Você também pode colar."></textarea></div><div id="au-out" style="font-size:13px;color:var(--muted)"></div></div>'+
   '<div class="ft"><span></span><div class="r"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="au-go" onclick="autosRun()"'+aiOff()+'>'+ic('spark')+'Analisar e cadastrar</button></div></div>',true);
}
async function autosLer(inp){var f=inp.files[0];if(!f)return;var info=document.getElementById('au-info'),ta=document.getElementById('au-txt');info.textContent='Lendo '+f.name+'…';
  try{if(/pdf/i.test(f.type)||/\.pdf$/i.test(f.name)){var r=await pdfText(f,function(i,n){info.textContent='Lendo página '+i+' de '+n});ta.value=r.text;info.textContent=f.name+' · '+r.pages+' página(s) · '+Math.round(r.text.length/1000)+' mil caracteres'+(r.text.replace(/---.*---/g,'').trim().length<200?' · pouco texto: o PDF pode ser digitalizado (imagem)':'')}else{ta.value=await f.text();info.textContent=f.name}}catch(e){info.textContent='Erro: '+e.message}}
function cortarAutos(t){var MAX=140000;return t.length<=MAX?t:t.slice(0,90000)+'\n\n[... trecho intermediário omitido ...]\n\n'+t.slice(-50000)}
async function autosRun(){

  var b=document.getElementById('au-go'),out=document.getElementById('au-out');b.disabled=true;out.textContent='Analisando os autos com IA… pode levar um minuto.';
  try{
    var o=await SAMPLE.json('Você é assistente de cadastro do escritório '+CFG.escritorio+'. Analise os autos abaixo e responda SOMENTE um JSON:\n{"processo":{"numero":"CNJ ou vazio","objeto":"classe e objeto resumido","orgao":"vara/câmara","comarca":"","tribunal":"sigla","uf":"","area":"uma de: '+AREAS.join(', ')+'","valorCausa":número ou null,"distribuicao":"AAAA-MM-DD ou vazio","situacao":"uma de: '+SIT.join(', ')+'","fase":"uma de: '+FASES.join(', ')+'","resumo":"3 a 5 frases: o que se discute, situação atual e próximo passo"},"cliente":{"nome":"parte representada pelo escritório (advogado '+equipe().join(', ')+'), se identificável","pessoa":"Física ou Jurídica","doc":"CPF/CNPJ ou vazio","polo":"Autor, Réu, Exequente, Executado, Requerente, Requerido, Impetrante ou Terceiro interessado"},"parteContraria":"","andamentos":[{"data":"AAAA-MM-DD","descricao":"andamento relevante resumido"}],"prazos":[{"data":"AAAA-MM-DD","titulo":"","tipo":"Prazo ou Audiência"}]}\nInclua todos os andamentos relevantes (petições, decisões, sentenças, recursos, audiências) em ordem cronológica, e só prazos ainda em aberto com data calculável.\n\nAUTOS:\n'+cortarAutos(t),{modelTier:'complex'});
    o=o||{};var pr=o.processo||{},cl=o.cliente||{};var p=parseCNJ(pr.numero||'');
    var data={numero:p?p.numero:(pr.numero||''),objeto:pr.objeto||'',orgao:pr.orgao||'',comarca:pr.comarca||'',tribunal:pr.tribunal||(p?p.tribunal:''),uf:pr.uf||(p?p.uf:''),area:AREAS.indexOf(pr.area)>=0?pr.area:'Cível',valorCausa:pr.valorCausa||null,distribuicao:pr.distribuicao||'',situacao:SIT.indexOf(pr.situacao)>=0?pr.situacao:'Em andamento',fase:FASES.indexOf(pr.fase)>=0?pr.fase:'Conhecimento',polo:cl.polo||'',parteContraria:o.parteContraria||'',obs:pr.resumo||'',responsavel:equipe()[0]||''};
    var cid=document.getElementById('au-cli').value;if(!cid&&cl.nome)cid=await garantirCliente(cl.nome,{pessoa:cl.pessoa==='Física'?'Física':'Jurídica',doc:cl.doc||''});data.cliente=cid||'';
    var dup=data.numero&&procPorNumero(data.numero);
    var novos=(o.andamentos||[]).filter(function(x){return x&&/^\d{4}-\d{2}-\d{2}$/.test(x.data||'')&&x.descricao}).map(function(x){return {data:x.data,descricao:String(x.descricao).slice(0,500),origem:'Autos'}});
    var pid;
    if(dup){var ex=dup.andamentos||[];novos=novos.filter(function(n){return !ex.some(function(e){return e.data===n.data&&String(e.descricao||'').slice(0,40)===n.descricao.slice(0,40)})});
      var upd={andamentos:ex.concat(novos)};['objeto','orgao','comarca','valorCausa','distribuicao','parteContraria','polo','cliente'].forEach(function(k){if(!dup[k]&&data[k])upd[k]=data[k]});if(data.obs)upd.obs=(dup.obs?dup.obs+'\n\n':'')+'Resumo dos autos ('+fd(today())+'): '+data.obs;
      await patch('processos',dup.id,upd);pid=dup.id}
    else{data.andamentos=novos;pid=await save('processos',data)}
    var pz=(o.prazos||[]).filter(function(x){return x&&/^\d{4}-\d{2}-\d{2}$/.test(x.data||'')&&x.data>=today()});
    for(var j=0;j<pz.length;j++){await save('agenda',{tipo:pz[j].tipo==='Audiência'?'Audiência':'Prazo',titulo:pz[j].titulo||'Prazo',data:pz[j].data,processo:pid,cliente:data.cliente,responsavel:equipe()[0]||'',status:'Pendente',prioridade:'Alta',coluna:'A fazer',lembrete:'3 dias antes',obs:'Identificado na importação dos autos'})}
    toast((dup?'Processo atualizado':'Processo cadastrado')+': '+novos.length+' andamento(s), '+pz.length+' prazo(s)');verProcesso(pid);
  }catch(e){out.textContent='Não foi possível: '+((e&&(e.message||e.code))||e);b.disabled=false}
}

    ['+ Audiência',"formAgenda(null,{processo:'"+id+"',cliente:'"+cl+"',tipo:'Audiência'})"],
    ['+ Tarefa',"formAgenda(null,{processo:'"+id+"',cliente:'"+cl+"',tipo:'Tarefa',coluna:'A fazer'})"],
    ['+ Publicação',"formPub(null,{numero:'"+esc(p.numero||'')+"',tribunal:'"+esc(p.tribunal||'')+"',disponibilizacao:today(),status:'Nova',tipo:'Intimação'})"],

  var tl=[].concat(pubs.map(function(x){return {d:x.disponibilizacao,t:(x.tipo||'Publicação')+': '+String(x.texto||'').slice(0,160),s:'Publicação · '+(x.tribunal||'')}}),ints.map(function(x){return {d:x.recebida,t:(x.tipo||'Intimação')+(x.obs?': '+x.obs.slice(0,140):''),s:'Intimação · '+(x.tribunal||'')}}),feitos.map(function(a){return {d:a.data,t:a.titulo,s:a.tipo+' concluído'}})).filter(function(x){return x.d}).sort(function(a,b){return a.d<b.d?1:-1});

  var hs=bd.querySelectorAll(':scope > div');var alvo=null;hs.forEach(function(d){var h3=d.querySelector('h3');if(h3&&/^Andamentos/.test(h3.textContent))alvo=d});

  try{var r2=await fetch('https://publica.cnpj.ws/cnpj/'+d);if(r2.ok){var k=await r2.json(),e=k.estabelecimento||{};return {nome:k.razao_social,fantasia:e.nome_fantasia,end:[[e.tipo_logradouro,e.logradouro].filter(Boolean).join(' '),e.numero,e.complemento,e.bairro].filter(Boolean).join(', ')+(e.cep?' – CEP '+String(e.cep).replace(/^(\d{5})(\d{3})$/,'$1-$2'):''),cidade:e.cidade&&e.cidade.nome,uf:e.estado&&e.estado.sigla,email:e.email,tel:e.ddd1&&e.telefone1?e.ddd1+e.telefone1:'',socio:(k.socios&&k.socios[0]&&k.socios[0].nome)||'',situacao:e.situacao_cadastral}}if(r2.status===404)return null}catch(e){}

  if(!x){cepHint('CEP não encontrado.','erro');return}
  var en=document.getElementById('fm-endereco');
  if(en){var ini=(x.rua||'')+(x.rua?', ':'');en.value=ini+(x.bairro?' – '+x.bairro:'');try{en.focus();en.setSelectionRange(ini.length,ini.length)}catch(e){}}
  var ci=document.getElementById('fm-cidade');if(ci&&x.cidade)ci.value=x.cidade;
  var uf=document.getElementById('fm-uf');if(uf&&x.uf)uf.value=x.uf;
  cepHint(x.rua?'Endereço preenchido. Digite o número e o complemento logo após o nome da rua.':'CEP geral da cidade: complete o endereço.');
});

/* ---------- excluir pessoa / campos da parte contrária ---------- */
if(!ICON.del)ICON.del='<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>';
function askDelPessoa(id){
  var c=byId('clientes',id);if(!c)return;
  var n={p:S.processos.filter(function(x){return x.cliente===id}).length,f:S.faturas.filter(function(x){return x.cliente===id}).length,a:S.atendimentos.filter(function(x){return x.cliente===id}).length,k:S.contratos.filter(function(x){return x.cliente===id}).length};
  var lig=[[n.p,'processo','processos'],[n.a,'atendimento','atendimentos'],[n.k,'contrato','contratos'],[n.f,'fatura','faturas']].filter(function(x){return x[0]}).map(function(x){return x[0]+' '+(x[0]===1?x[1]:x[2])});
  document.getElementById('delzone').innerHTML='<span class="confirm">'+(lig.length?'Há '+lig.join(', ')+(n.p+n.a+n.k+n.f===1?' ligado':' ligados')+' a esta pessoa'+(n.p+n.a+n.k+n.f===1?', que ficará':', que ficarão')+' sem cadastro vinculado. ':'')+'Excluir definitivamente? <button type="button" class="btn sm danger" onclick="delPessoa(\''+id+'\')">Sim, excluir</button><button type="button" class="btn sm" onclick="verCliente(\''+id+'\')">Não</button></span>';
}
async function delPessoa(id){try{await removeDoc('clientes',id);closeModal();toast('Cadastro excluído')}catch(e){toast('Não foi possível excluir')}}
function pcCampos(){
  var t=document.getElementById('fm-tipo');if(!t||!CUR||CUR.col!=='clientes')return;var pc=t.value==='Parte contrária';
  ['responsavel','origem'].forEach(function(k){var f=document.getElementById('fm-'+k);if(!f)return;f.disabled=pc;var w=f.closest('.f');if(w)w.style.display=pc?'none':''});
}
document.addEventListener('change',function(ev){if(ev.target&&ev.target.id==='fm-tipo')pcCampos()});
var _formClientePC=formCliente;formCliente=function(){var r=_formClientePC.apply(this,arguments);pcCampos();return r};

boot();
</script>
